# Generated by scripts/branding.sh from assets/branding/*.svg. Android only.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/generated/icon_full_1024.png"
  adaptive_icon_background: "#006A4E"
  adaptive_icon_foreground: "assets/branding/generated/icon_foreground_1024.png"
  adaptive_icon_monochrome: "assets/branding/generated/icon_monochrome_1024.png"
  # The SVG already keeps the art inside the safe zone; no extra shrink.
  adaptive_icon_foreground_inset: 0
